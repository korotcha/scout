  <script>
    const icon=(n)=>({search:'<svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',grid:'<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',bookmark:'<svg class="icon" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',chart:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg>',sliders:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',bell:'<svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7M10 19h4"/></svg>'})[n];
    const logo='<div class="logo"><div class="logo-mark">MR</div><span>Market Radar</span></div>';
    function radar(){return `<section class="view radar"><header class="radar-top">${logo}<div class="top-actions"><button class="round-btn" aria-label="Уведомления">${icon('bell')}</button><div class="user">AK</div></div></header><div class="radar-main"><aside class="panel filter-panel"><div class="panel-label">Область поиска</div><div class="field"><div class="field-title">Маркетплейсы</div><div class="market-buttons"><button class="market-btn selected"><span class="market-tag"><i class="wb-dot"></i>WB</span></button><button class="market-btn selected"><span class="market-tag"><i class="oz-dot"></i>Ozon</span></button></div></div><div class="field"><div class="field-title">Выручка ниши, ₽/мес.</div><div class="range-row"><input class="input" value="5 млн"><input class="input" value="80 млн"></div></div><div class="field"><div class="field-title">Средняя цена, ₽</div><div class="range-row"><input class="input" value="2 500"><input class="input" value="35 000"></div></div><div class="field"><label class="check"><input type="checkbox" checked> Рост за 90 дней от 15%</label><label class="check"><input type="checkbox" checked> Продавцов не более 40</label><label class="check"><input type="checkbox"> Только без бренда-монополиста</label></div><button class="apply" onclick="pulseBubbles()">Обновить карту</button></aside><section class="panel radar-canvas"><div class="section-head"><div><h1>Карта возможностей</h1><div class="tiny">247 ниш соответствуют фильтрам</div></div><div class="legend"><span><i style="background:#c9f27b"></i>лучший баланс</span><span><i style="background:#ffd4c2"></i>быстрый рост</span></div></div><div class="map"><div class="axis-y">Рост спроса →</div><div class="axis-x">Конкуренция →</div><button class="bubble b1 active" data-name="Беспроводные пылесосы" onclick="selectBubble(this)"><span><strong>Пылесосы</strong><small>+31% · 78 баллов</small></span></button><button class="bubble b2" data-name="Льдогенераторы" onclick="selectBubble(this)"><span><strong>Льдогенераторы</strong><small>+44% · 72</small></span></button><button class="bubble b3" data-name="Кофемашины" onclick="selectBubble(this)"><span><strong>Кофемашины</strong><small>+18% · 69</small></span></button><button class="bubble b4" data-name="Осушители" onclick="selectBubble(this)"><span><strong>Осушители</strong><small>+26% · 74</small></span></button><button class="bubble b5" data-name="Очистители воздуха" onclick="selectBubble(this)"><span><strong>Очистители</strong><small>+15% · 66</small></span></button><button class="bubble b6" data-name="Мини-печи" onclick="selectBubble(this)"><span><strong>Мини-печи</strong><small>+12% · 61</small></span></button></div></section><aside class="panel detail"><span class="detail-badge">Кандидат №1</span><h2 id="radar-name">Беспроводные пылесосы</h2><div class="tiny"><span class="market-tag"><i class="wb-dot"></i>WB</span> + <span class="market-tag"><i class="oz-dot"></i>Ozon</span></div><div class="score"><div class="score-ring"><b>78</b></div><div><b>Сильная возможность</b><div class="tiny">7 из 9 сигналов положительные</div></div></div><div class="metrics"><div class="metric"><b class="num">₽42,8 млн</b><span class="tiny">выручка / мес.</span></div><div class="metric"><b class="num">+31%</b><span class="tiny">рост за 90 дней</span></div><div class="metric"><b class="num">₽12 490</b><span class="tiny">средняя цена</span></div><div class="metric"><b class="num">27</b><span class="tiny">активных продавцов</span></div></div><div class="panel-label">Почему стоит смотреть</div><div class="signal"><span class="signal-icon">↗</span><span>Спрос растёт быстрее количества новых карточек</span></div><div class="signal"><span class="signal-icon">◫</span><span>Топ-10 занимает только 48% выручки</span></div><div class="signal"><span class="signal-icon">₽</span><span>Маржа после логистики оценивается в 24%</span></div><button class="save" onclick="saveCandidate(this)">Добавить в проработку</button></aside></div></section>`}
    const rows=[['☕','Рожковые кофемашины','Ozon','84,2 млн','+18%','34','12 990','69'],['◉','Беспроводные пылесосы','WB + Ozon','42,8 млн','+31%','27','12 490','78'],['❄','Льдогенераторы','Ozon','18,6 млн','+44%','19','8 740','72'],['≈','Осушители воздуха','WB','11,9 млн','+26%','15','9 260','74'],['▤','Мини-печи','WB + Ozon','31,5 млн','+12%','46','7 890','61'],['✦','Очистители воздуха','Ozon','53,1 млн','+15%','38','15 600','66'],['♨','Паровые швабры','WB','21,7 млн','−4%','51','6 490','48']];
    function screener(){return `<section class="view screener"><aside class="side">${logo}<div class="nav-item on">${icon('grid')}<span>Скринер</span></div><div class="nav-item">${icon('bookmark')}<span>Кандидаты</span><b class="side-count">12</b></div><div class="nav-item">${icon('chart')}<span>Сравнение</span></div><div class="nav-item">${icon('sliders')}<span>Пресеты</span></div><div class="side-foot">Данные обновлены<br>сегодня в 06:40</div></aside><main class="screen-main"><div class="screen-head"><div><h1>Поиск ниш</h1><div class="tiny">WB и Ozon · данные за последние 90 дней</div></div><button class="primary">Сохранить фильтр</button></div><div class="filterbar"><label class="search">${icon('search')}<input id="table-search" placeholder="Категория или товар…" oninput="filterRows(this.value)"></label><select class="filter-select" onchange="filterRows(document.getElementById('table-search').value)"><option>Все площадки</option><option>Ozon</option><option>WB</option></select><select class="filter-select"><option>Выручка от 10 млн</option><option>От 30 млн</option></select><select class="filter-select"><option>Рост от 10%</option><option>Рост от 25%</option></select></div><div class="table-shell"><table class="data-table"><thead><tr><th></th><th>Ниша</th><th>Площадка</th><th>Выручка / мес.</th><th>Рост 90 дн.</th><th>Продавцы</th><th>Ср. цена</th><th>Оценка ↓</th></tr></thead><tbody id="screen-rows">${rows.map((r,i)=>`<tr><td><input class="row-check" type="checkbox" onchange="toggleRow(this)"></td><td><div class="catcell"><span class="cat-icon">${r[0]}</span><b>${r[1]}</b></div></td><td>${r[2]}</td><td class="num">₽${r[3]}</td><td class="${r[4].startsWith('+')?'trend-up':'trend-down'}">${r[4]}</td><td>${r[5]}</td><td class="num">₽${r[6]}</td><td><span class="score-pill">${r[7]}</span></td></tr>`).join('')}</tbody></table></div><div id="bulk" class="bulk"><span><b id="selected-count">0</b> выбрано</span><button onclick="clearSelection()">Добавить в кандидаты</button></div><div class="pagination"><span>Показано 7 из 247 ниш</span><div class="pages"><button class="on">1</button><button>2</button><button>3</button><button>→</button></div></div></main></section>`}
    const candidates=[['Беспроводные пылесосы','WB + Ozon','78','42,8 млн','+31%','Спрос растёт, а концентрация топ-10 ниже средней. Можно зайти с сильным комплектом насадок.'],['Осушители воздуха','WB','74','11,9 млн','+26%','Ниша меньше, но конкуренция низкая. Хороший кандидат для быстрого теста небольшой партией.'],['Льдогенераторы','Ozon','72','18,6 млн','+44%','Самый быстрый рост, но выраженная сезонность. Решение нужно принять до октября.']];
    function funnel(){return `<section class="view funnel"><header class="funnel-top">${logo}<div class="stepper"><div class="step"><i>1</i><span>Критерии</span></div><span class="step-line"></span><div class="step on"><i>2</i><span>Отбор</span></div><span class="step-line"></span><div class="step"><i>3</i><span>Сравнение</span></div></div><div class="user" style="color:#172019">AK</div></header><main class="funnel-main"><div class="funnel-title"><div><h1>Отберите товары для проверки</h1><p>Мы нашли 9 сильных вариантов. Выберите минимум два.</p></div><div class="progress-num"><b id="approved-num">0</b> / 9 выбрано</div></div><div class="cards">${candidates.map((c,i)=>`<article class="candidate"><div class="candidate-top"><div><h3>${c[0]}</h3><span class="tiny">${c[1]}</span></div><span class="candidate-score">${c[2]}</span></div><div class="candidate-chart">${[34,46,42,57,53,69,75,68,88,94].map((h,j)=>`<i class="${j>7?'hot':''}" style="height:${h}%"></i>`).join('')}</div><div class="candidate-metrics"><div><small>Выручка / мес.</small><b>₽${c[3]}</b></div><div><small>Рост 90 дней</small><b style="color:#d8ff7a">${c[4]}</b></div></div><p class="why">${c[5]}</p><div class="candidate-actions"><button onclick="rejectCard(this)">Пропустить</button><button class="yes" onclick="approveCard(this)">Взять</button></div></article>`).join('')}</div><div class="decision-dock"><div><b id="dock-title">Пока ничего не выбрано</b><span class="tiny" id="dock-copy">Отметьте два товара, чтобы перейти к сравнению.</span></div><button class="continue" id="continue" disabled onclick="showToast('Открываем сравнение выбранных ниш')">Сравнить →</button></div></main><div class="toast" id="toast"></div></section>`}
    const variants=[radar,screener,funnel];
    const stage=document.getElementById('stage');const picker=document.querySelector('.proto-picker');const highlight=picker.querySelector('.proto-picker-highlight');const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];const replay=picker.querySelector('.proto-picker-replay');let current=0;
    function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
    function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();})}
    function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}
    items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));replay?.addEventListener('click',()=>mount(current));window.addEventListener('resize',moveHighlight);document.addEventListener('keydown',(e)=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.metaKey||e.ctrlKey||e.altKey)return;const num=parseInt(e.key,10);if(num>=1&&num<=variants.length)setActive(num-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current)});setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
    function selectBubble(el){document.querySelectorAll('.bubble').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('radar-name').textContent=el.dataset.name}
    function pulseBubbles(){document.querySelectorAll('.bubble').forEach((b,i)=>{b.animate([{transform:'scale(.94)',opacity:.65},{transform:'scale(1)',opacity:1}],{duration:220,delay:i*25,easing:'cubic-bezier(.23,1,.32,1)'})})}
    function saveCandidate(btn){btn.textContent='Добавлено ✓';btn.classList.add('saved')}
    function toggleRow(input){input.closest('tr').classList.toggle('selected',input.checked);const n=document.querySelectorAll('.row-check:checked').length;document.getElementById('selected-count').textContent=n;document.getElementById('bulk').classList.toggle('show',n>0)}
    function clearSelection(){document.querySelectorAll('.row-check').forEach(x=>{x.checked=false;x.closest('tr').classList.remove('selected')});document.getElementById('bulk').classList.remove('show')}
    function filterRows(q){q=q.toLowerCase();document.querySelectorAll('#screen-rows tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none')}
    let approved=0;function approveCard(btn){const card=btn.closest('.candidate');const on=card.classList.toggle('approved');btn.textContent=on?'Выбрано ✓':'Взять';approved+=on?1:-1;updateDecision()}
    function rejectCard(btn){btn.closest('.candidate').style.opacity=.35;btn.textContent='Пропущено'}
    function updateDecision(){document.getElementById('approved-num').textContent=approved;const go=document.getElementById('continue');go.disabled=approved<2;document.getElementById('dock-title').textContent=approved?`Выбрано: ${approved}`:'Пока ничего не выбрано';document.getElementById('dock-copy').textContent=approved<2?'Отметьте два товара, чтобы перейти к сравнению.':'Можно сравнить экономику и риски выбранных ниш.'}
    function showToast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
  </script>
